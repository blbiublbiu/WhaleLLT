name: Build Android APK (Dynamic Injection + Fix Kotlin)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 与 Java 21
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. 安装依赖并强制下载 Capacitor 引擎
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: 4. 物理隔离静态资源
        run: |
          mkdir app_www
          cp *.html *.json *.js *.css app_www/ || true
          cp -r api config icons js lib netlify scripts utils app_www/ || true
          rm -f app_www/package*.json app_www/*.toml || true

      - name: 5. 动态生成控制台与 Android 模具
        run: |
          npx cap init "MyNewApp" "com.mywebapp.newapp" --web-dir app_www
          npx cap add android

      - name: 6. 强制修复 Kotlin 底层依赖冲突 (物理拔线)
        # 用 bash 强行往生成的 build.gradle 末尾注入依赖替换规则，解决 Duplicate class 报错
        run: |
          echo "
          configurations.all {
              resolutionStrategy.dependencySubstitution {
                  substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                  substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
              }
          }
          " >> ./android/app/build.gradle

      - name: 7. 赋予编译权限并生成 APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 8. 上传最终 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: new-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
